name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (worker, tests, console)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Validate migrations
        run: npm run db:validate

      - name: List migrations
        run: npm run db:list

      - name: Build the admin console
        run: npm run build:web

      - name: Bundle the Worker (no deploy)
        run: npx wrangler deploy --dry-run --config worker/wrangler.toml --outdir dist/worker

      - name: Environment check (report only)
        run: npm run check:env
        continue-on-error: true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: aether-build
          path: |
            dist/web
            dist/worker
          retention-days: 7
