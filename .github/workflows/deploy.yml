name: Deploy to Cloudflare (manual, gated)

# Production deployment is intentionally NOT triggered by pushes.
#
# Requirements before this workflow can succeed:
#   1. A GitHub Environment named "production" with required reviewers.
#   2. Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#   3. Worker runtime secrets set with `wrangler secret put` (JWT_SECRET, optional
#      TURNSTILE_SECRET_KEY, optional R2_<REF>_* namespaces). They are NOT GitHub secrets.
#   4. Real D1/KV ids and the bucket name in worker/wrangler.toml.
#
# See docs/DEPLOYMENT.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy-production" to confirm
        required: true
        type: string
      apply_migrations:
        description: Apply pending D1 migrations before deploying the Worker
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm the deployment
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'deploy-production' }}
        run: |
          echo "::error::Confirmation text did not match. Refusing to deploy."
          exit 1

  deploy:
    name: Deploy the API
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.AETHER_WORKER_HOST }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the code before touching production
        run: npm run check:all

      - name: Check environment
        run: npm run check:env -- --strict

      - name: Validate migrations locally
        run: npm run db:validate

      - name: Apply migrations to production D1
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply DB --remote --config worker/wrangler.toml

      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run --config worker/wrangler.toml --outdir dist/worker

      - name: Deploy the Worker
        run: npx wrangler deploy --config worker/wrangler.toml

      - name: Smoke test /api/health
        if: ${{ vars.AETHER_WORKER_HOST != '' }}
        run: |
          set -euo pipefail
          body=$(curl -fsS "https://${{ vars.AETHER_WORKER_HOST }}/api/health")
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::Health check failed"; exit 1; }
